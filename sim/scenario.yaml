# Rev 2 flight computer flying the team's locked_in_flight.csv open loop. Run: sim/run.sh
machines:
  fc:
    mcu: STM32H743VG          # stand-in: sim has no STM32H750 (same die family, less flash)
    elf: build/appa.elf
    overlay: fc.board
    parts:
      - { name: baro,  type: i2c-device,  bus: i2c1, address: 0x76, script: peers/bmp390_peer.py }
      - { name: imu,   type: i2c-device,  bus: i2c2, address: 0x68, script: peers/bmi270_peer.py }
      - { name: mag,   type: i2c-device,  bus: i2c2, address: 0x10, script: peers/bmm150_peer.py }
      - { name: flash, type: spi-device,  bus: spi2, cs: PB12,      script: peers/sst25_peer.py }
      - { name: lora,  type: spi-device,  bus: spi4, cs: PC0,       script: peers/sx1276_peer.py }
      - { name: arm,   type: gpio-device, outputs: PD7,             script: peers/arm_switch_peer.py }
